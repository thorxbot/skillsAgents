name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: skills/ipa-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Import without warnings
        run: python -W error -c "import ipa_analyzer, ipa_analyzer.cli"
      - name: Smoke (no install entry point)
        run: python scripts/ipa_analyze.py --help
      - name: Tests
        run: python -m pytest -q
